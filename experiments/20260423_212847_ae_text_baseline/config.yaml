{
  "assembly": {
    "dataset_name": "text_baseline",
    "metadata_columns": [
      "cik_str",
      "title",
      "search_label"
    ],
    "required_feature_groups": [
      "price_volatility",
      "price_momentum",
      "price_liquidity",
      "text_business",
      "text_risk"
    ]
  },
  "data": {
    "annual_form": "10-K",
    "end_date": null,
    "filings_group_name": "S&P 500 Filings (2026-04-23 roster)",
    "prices_group_name": "S&P 500 Prices Since 2010 (2026-04-23 roster)",
    "quarterly_form": "10-Q",
    "start_date": "2010-01-01"
  },
  "evaluation": {
    "enabled": []
  },
  "experiment_name": "ae_text_baseline",
  "features": {
    "enabled": [
      "price_volatility",
      "price_momentum",
      "price_liquidity",
      "text_business",
      "text_risk"
    ],
    "price": {
      "liquidity_windows": [
        21,
        63
      ],
      "min_history_days": 252,
      "momentum_windows": [
        21,
        63,
        252
      ],
      "volatility_windows": [
        21,
        63,
        252
      ]
    },
    "text": {
      "business_embedding_dim": 32,
      "min_token_length": 3,
      "risk_embedding_dim": 32
    }
  },
  "model": {
    "batch_size": 512,
    "embedding_dim": 8,
    "epochs": 40,
    "exclude_columns": [
      "ticker",
      "date",
      "cik_str",
      "title",
      "search_label"
    ],
    "hidden_dim": 64,
    "learning_rate": 0.001,
    "name": "autoencoder",
    "weight_decay": 1e-05
  },
  "paths": {
    "dataset_dir": "data/processed/datasets",
    "experiments_dir": "experiments",
    "feature_dir": "data/processed/features",
    "sections_dir": "data/processed/sections",
    "sqlite_path": "data/raw_filing_corpora/raw_filing_corpora.sqlite"
  },
  "random_seed": 7
}